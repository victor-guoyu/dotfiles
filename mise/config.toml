# Global mise tools: the versions used outside any project with its own
# mise.toml. Linked to ~/.config/mise by install.sh.

[tools]
# One recent Go for everything outside a pinned repo, Mason's `go install`
# builds of gopls and friends included. Go fetches whatever newer toolchain
# a go.mod asks for by itself (GOTOOLCHAIN=auto), so this needn't track
# projects.
go = "latest"
# Default node, for the shell and for Mason's npm installs (pyright, vtsls).
node = "24"

[settings]
# Follow a repo's .nvmrc / .node-version, as fnm's --use-on-cd did. Off by
# default in mise, so without this only repos whose own mise.toml asks for
# it (grafana's does) would switch. Unlike fnm, mise ignores package.json's
# "engines".
idiomatic_version_file_enable_tools = ["node"]
