# reload tmux config
unbind r
bind r source-file ~/.tmux.conf

# leader key to control + ]
set -g prefix C-]

# mouse support
set -g mouse on

# Forward terminal focus events into programs like Neovim. Without this, tmux
# swallows FocusGained/FocusLost, so Neovim never notices a file was changed on
# disk (e.g. by a coding agent) when you switch back to its pane. With it on,
# LazyVim's checktime autocmd fires on focus and reloads the buffer.
set -g focus-events on

# vim bindings
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# copy-paste
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"


# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'

set -g @dracula-show-powerline true
set -g @dracula-plugins "cpu-usage ram-usage"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-show-powerline true
set -g status-position top

# initialize TMUX plugin manager (keep this at the bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

